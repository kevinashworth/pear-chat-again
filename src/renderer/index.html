<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self';"
    />
    <title>Pear Chat</title>
    <link href="./build/output.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-950 text-neutral-100 h-screen flex flex-col font-sans antialiased">
    <header class="px-6 py-4 border-b border-neutral-900 flex items-center justify-between gap-4">
      <div class="flex items-baseline gap-2.5">
        <img src="pear.svg" class="h-5 w-auto" alt="Pear logo" aria-hidden="true" />
        <h1 class="text-base font-medium tracking-tight">Pear Chat</h1>
        <div class="text-sm text-neutral-200" id="username">Username</div>
        <span id="version" class="text-xs text-neutral-600"></span>
        <button
          id="update"
          type="button"
          class="hidden rounded-full bg-lime-400/15 px-3 py-1 text-xs font-medium text-lime-300 hover:bg-lime-400/25 transition"
        >
          Update ready — restart
        </button>
      </div>

      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1.5 text-xs text-neutral-500">
          <span id="dot" class="size-2 rounded-full bg-neutral-600"></span>
          <span id="peers">0 peers</span>
        </span>
        <button
          id="copy-invite"
          type="button"
          disabled
          class="rounded-full border border-neutral-800 bg-neutral-900 px-3.5 py-1.5 text-xs font-medium text-neutral-200 hover:bg-neutral-800 disabled:cursor-not-allowed disabled:opacity-40 transition"
        >
          Copy invite
        </button>
      </div>
    </header>

    <main id="messages" class="flex-1 overflow-y-auto px-6 py-4 flex flex-col gap-2">
      <div id="empty" class="m-auto text-sm text-neutral-500">
        No messages yet. Copy the invite to bring a peer in.
      </div>
    </main>

    <footer class="px-6 py-4 border-t border-neutral-900">
      <form id="composer" class="flex gap-2">
        <input
          id="input"
          type="text"
          autocomplete="off"
          placeholder="Type a message..."
          class="flex-1 rounded-xl border border-neutral-800 bg-neutral-900 px-4 py-2.5 text-sm text-neutral-100 placeholder:text-neutral-500 focus:border-neutral-600 focus:outline-none transition"
        />
        <button
          id="send"
          type="submit"
          disabled
          class="rounded-xl bg-lime-400 px-5 py-2.5 text-sm font-medium text-black hover:bg-lime-300 disabled:cursor-not-allowed disabled:opacity-30 transition"
        >
          Send
        </button>
      </form>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
